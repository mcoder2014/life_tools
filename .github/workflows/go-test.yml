name: Go Test

on:
  pull_request:
    paths:
      - '.github/workflows/go-test.yml'
      - 'go.mod'
      - 'go.sum'
      - 'cli/codex_inspector/**'
      - '**/*.go'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/go-test.yml'
      - 'go.mod'
      - 'go.sum'
      - 'cli/codex_inspector/**'
      - '**/*.go'

permissions:
  contents: read

jobs:
  go-test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: true

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
